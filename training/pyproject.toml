[project]
name = "rlm-train"
version = "0.1.0"
description = "Verifiers-compatible training harness for Recursive Language Models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

dependencies = [
    "rlms>=0.1.1",
    "verifiers>=0.1.11.dev0",
    "aiohttp>=3.9",
    "pydantic>=2.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "ruff>=0.14", "scipy>=1.15,<2"]
regularization = ["numpy>=1.26,<3", "torch>=2.4,<2.12"]
colab = [
    "accelerate==1.12.0",
    "bitsandbytes==0.49.1",
    "openai==2.14.0",
    "peft==0.18.0",
    "safetensors==0.7.0",
    "transformers==4.57.3",
]

[project.scripts]
rlm-train-replay = "rlm_train.trajectory.replay:main"
rlm-train-ood-dry-run = "rlm_train.experiment.dry_run:main"
rlm-train-colab = "rlm_train.colab.launcher:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm_train"]

[tool.uv.sources]
rlms = { path = "../", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

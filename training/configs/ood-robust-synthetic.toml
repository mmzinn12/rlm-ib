schema_version = 1

[training]
algorithm = "sdpo"

[training.teacher]
strategy = "fixed"
checkpoint_identity = "initial-policy"

[training.feedback]
mode = "diagnostic"
projector_version = "v1"

[training.sdpo]
teacher = "fixed"

[training.gram]
enabled = false
loss_weight = 0.0

[evaluation]
samples_per_problem = 4
checkpoint_steps = [0, 20, 40]
base_seed = 1729

[evaluation.diagnostics]
epistemic_markers = true
reasoning_dynamics = true
divergence = true
gram_drift = true

[[evaluation.benchmarks]]
adapter = "jsonl"
name = "synthetic-arithmetic"
version = "v1"
split = "development"
role = "development"
path = "../benchmarks/synthetic-arithmetic.jsonl"
answer_pattern = 'FINAL:\s*(?P<answer>[-+]?\d+)'
case_sensitive = true
